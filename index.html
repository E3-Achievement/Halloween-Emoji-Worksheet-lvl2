<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Builder</title><style>
.ws{--ink:#1c1526;--orange:#f47b20;--purple:#6b3fa0;--soft:#fff4e6;--red:#d62828;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;color:var(--ink)}
.ws *{box-sizing:border-box}
.ws .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.ws .top h1{margin:0;font-size:34px;color:var(--purple);line-height:1.1}
.ws .top .he{font-size:42px;margin-right:10px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.ws .name{flex:0 0 3.1in;max-width:50%;border-bottom:3px solid var(--ink);height:44px;position:relative}
.ws .name::before{content:"✏️";position:absolute;left:0;bottom:6px;font-size:22px}
.ws .name input{width:100%;height:100%;border:0;background:transparent;font:inherit;font-size:22px;padding:0 0 0 34px;outline:none;color:var(--ink)}
.ws .act{margin:0 0 16px;padding:12px 14px 14px;border:3px dashed var(--purple);border-radius:14px}
.ws .act h2{margin:0 0 8px;font-size:21px;display:flex;align-items:center;gap:10px}
.ws .badge{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;font-size:20px;display:inline-flex;align-items:center;justify-content:center}
.ws .ttl{flex:1 1 auto}
.ws .icon-hint{font-size:24px;margin-left:auto;white-space:nowrap}
.ws .say{margin-left:4px;font-size:24px;border:2px solid var(--purple);background:#fff;border-radius:12px;padding:2px 10px;cursor:pointer}
.ws .emo{font-size:54px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.ws .picwrap{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 6px}
.ws .picwrap.pick{border-radius:16px}
.ws .wlabel{font-size:13px;font-weight:700;letter-spacing:1px;color:var(--purple);text-transform:uppercase;line-height:1;white-space:nowrap}
@media (max-width:640px){.ws .wlabel{font-size:10px}}
.ws .picwrap.wordonly{padding:0}
.ws .wtext{display:inline-block;font-size:26px;font-weight:800;letter-spacing:1px;padding:10px 16px;border:3px solid var(--ink);border-radius:12px;background:#fff;white-space:nowrap}
.ws-digital .stampbtn.textstamp{font-size:16px;font-weight:800;letter-spacing:.5px;padding:8px 10px}
@media (max-width:640px){.ws .wtext{font-size:18px;padding:6px 10px}}
.ws .q{margin:10px 0 2px;font-size:18px}
.ws .startnote{text-align:center;font-size:15px;color:var(--purple);margin-top:6px}

.ws .match{position:relative;display:flex;justify-content:space-between;padding:0 30px}
.ws .col{display:flex;flex-direction:column;gap:6px}
.ws .cell{display:flex;align-items:center;gap:6px;height:66px}
.ws-digital .cell.cellclick{cursor:pointer;border-radius:16px;padding:4px 8px;-webkit-tap-highlight-color:transparent;transition:background .12s}
.ws-digital .cell.cellclick:hover{background:#f4eefb}
.ws-digital .cell.cellclick:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.ws-digital .cell.cellclick.selcell{background:#ffe9d1;box-shadow:0 0 0 4px var(--orange)}
.ws-digital .cell.cellclick.selcell .dot::after{background:var(--orange);box-shadow:0 0 0 6px #ffd9b8}
.ws .col.right .cell{flex-direction:row-reverse}
.ws .dot{width:44px;height:44px;position:relative;flex:0 0 auto}
.ws .dot::after{content:"";position:absolute;left:13px;top:13px;width:18px;height:18px;border-radius:50%;background:var(--ink)}
.ws .lines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ws .ln{stroke:var(--purple);stroke-width:6;stroke-linecap:round}

.ws .row{display:flex;justify-content:space-around;align-items:center;padding:6px 0;border-bottom:2px dotted #cfc4dd}
.ws .row:last-child{border-bottom:0}
.ws .row .emo{padding:4px 12px}
.ws .count-row{display:flex;align-items:center;gap:20px;padding:4px 0;border-bottom:2px dotted #cfc4dd}
.ws .count-row:last-child{border-bottom:0}
.ws .group{flex:1;font-size:38px;letter-spacing:4px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.ws .wordgroup{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ws .wchip{font-size:16px;font-weight:800;letter-spacing:.5px;padding:5px 10px;border:2px solid var(--ink);border-radius:8px;background:#fff}
.ws .nums{display:flex;gap:22px}
.ws .nums.spread{justify-content:space-around;padding:0 60px}
.ws .num{font-size:40px;font-weight:700;width:64px;height:64px;display:inline-flex;align-items:center;justify-content:center}

.ws .bubble{display:flex;align-items:center;gap:14px;background:var(--soft);border:3px solid var(--orange);border-radius:20px;padding:8px 16px;margin-bottom:10px;flex-wrap:wrap}
.ws .bubble.wordbubble{padding:14px 18px}
.ws .wtext.sentence{border:0;padding:0;font-size:20px;font-weight:700;background:transparent;white-space:normal}
.ws .bubble .emo{font-size:46px}
.ws .swatch{width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);display:inline-block}
.ws .swatchwrap{display:inline-flex;flex-direction:column;align-items:center;gap:4px;padding:4px}
.ws .swatches{display:flex;justify-content:space-around;padding:8px 0 2px}
.ws .swatches .swatch{width:70px;height:70px}

.ws .sq{width:1.35in;height:1.35in;border:4px solid var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:40px;background:#fff;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.ws .sq.sample{border-color:var(--orange);background:var(--soft)}
.ws .compare{display:flex;align-items:center;justify-content:space-around;gap:10px;flex-wrap:wrap}
.ws .options{display:flex;gap:22px;padding:8px 10px}
.ws .lbl{text-align:center;font-size:30px}

.ws .steps{display:flex;justify-content:space-between;gap:6px}
.ws .step{text-align:center;flex:1}
.ws .step .emo{display:block;font-size:58px;margin-bottom:6px}
.ws .numbox{width:50px;height:50px;border:3px solid var(--ink);border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}
.ws .numbox.done,.ws .numbox.set{background:var(--purple);color:#fff;border-color:var(--purple)}
.ws .numbox.set{background:var(--orange);border-color:var(--orange)}
.ws-digital .step.click{cursor:pointer;border-radius:14px;padding:4px}
.ws-digital .step.click:hover{background:#f4eefb}

.ws .wordrow{display:flex;align-items:center;gap:18px;padding:4px 0;border-bottom:2px dotted #cfc4dd}
.ws .wordrow:last-child{border-bottom:0}
.ws .wordrow .emo{font-size:50px;width:80px;text-align:center}
.ws .words{display:flex;gap:30px;flex-wrap:wrap}
.ws .word{font-size:32px;font-weight:700;letter-spacing:3px;padding:4px 14px;border-radius:999px}

.ws .draw{display:flex;gap:16px;align-items:stretch}
.ws .picks{display:flex;flex-direction:column;justify-content:space-around;align-items:center;width:1.5in}
.ws .picks .emo{font-size:44px;padding:2px 8px}
.ws .canvas{flex:1;aspect-ratio:1/1;max-height:3.6in;border:5px dashed var(--orange);border-radius:8px;background:repeating-linear-gradient(0deg,transparent 0 39px,#f7ecdf 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,#f7ecdf 39px 40px)}

/* digital interaction */
.ws .pick{cursor:pointer;transition:box-shadow .12s,transform .12s;-webkit-tap-highlight-color:transparent;user-select:none;border-radius:50%}
.ws .pick:hover{box-shadow:0 0 0 3px #dccbf0}
.ws .pick:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.ws .pick.ring{box-shadow:0 0 0 6px var(--red);transform:rotate(-2deg)}
.ws .emo.pick,.ws .word.pick{display:inline-block}
.ws .sq.pick{border-radius:14px}
.ws .word.pick{border-radius:999px}
.ws .pick.xmark{position:relative}
.ws .pick.xmark.on::after{content:"✖";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;color:var(--red);opacity:.9}
.ws .donebar{text-align:center;margin:20px 0 6px}
.ws .bigbtn{font:inherit;font-size:22px;font-weight:700;background:var(--orange);color:#fff;border:0;border-radius:16px;padding:14px 26px;cursor:pointer;box-shadow:0 4px 0 #b95a10}
.ws .tbtn{font:inherit;font-size:16px;font-weight:700;background:#fff;color:var(--purple);border:2px solid var(--purple);border-radius:12px;padding:8px 14px;cursor:pointer}
.ws .tbtn.big{font-size:20px;padding:12px 20px}
.ws .result{border:4px solid var(--purple);border-radius:18px;padding:18px;background:#faf6ff;text-align:center;margin-top:14px}
.ws .result h2{margin:4px 0 10px;font-size:28px;color:var(--purple)}
.ws .stars{font-size:60px}
.ws .breakdown{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.ws .chip{font-size:22px;font-weight:700;padding:4px 12px;border-radius:999px;border:2px solid var(--line,#d9cfe6);background:#fff}
.ws .chip.ok{border-color:#2e9e47}
.ws .chip.try{border-color:var(--orange)}
.ws .emailrow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}
.ws .emailin{font:inherit;font-size:18px;padding:8px 10px;border:2px solid #cbbde0;border-radius:10px;min-width:260px}
.ws .rbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.ws .note{font-size:14px;color:#6d5f82;margin:12px 0 0}
.ws .dtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.ws .chipbtn{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink);cursor:pointer}
.ws .chipbtn.on{box-shadow:0 0 0 5px var(--orange)}
.ws .stampbtn{font-size:34px;line-height:1;border:3px solid transparent;background:#fff;border-radius:12px;padding:4px 6px;cursor:pointer;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.ws .stampbtn.on{border-color:var(--orange);background:var(--soft)}
.ws .sepbar{width:2px;height:34px;background:#d9cfe6;margin:0 4px}
.ws .dcanvas{width:100%;max-width:560px;aspect-ratio:1/1;border:5px dashed var(--orange);border-radius:8px;touch-action:none;background:#fff;display:block;margin:0 auto;cursor:crosshair}

.ws .writerow{display:flex;align-items:center;gap:20px;padding:10px 0;border-bottom:2px dotted #cfc4dd;flex-wrap:wrap}
.ws .writerow:last-child,.ws .buildrow:last-child{border-bottom:0}
.ws .writeline{flex:1 1 200px;min-width:160px;border-bottom:3px solid var(--ink);height:44px;display:block}
.ws .writein{flex:1 1 200px;min-width:160px;width:100%;font:inherit;font-size:26px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:8px 12px;border:3px solid #cbbde0;border-radius:10px}
.ws .answer{flex:1 1 220px;display:flex;flex-direction:column;gap:4px;min-width:180px}
.ws .hintline{font-size:24px;font-weight:800;letter-spacing:4px;color:var(--purple)}
.ws .prompt{display:flex;align-items:center;gap:10px;min-width:90px;justify-content:center}
.ws .tracesvg{height:auto;max-width:100%;display:block;overflow:visible}
.ws .tracesvg .ttext{font:800 92px "Trebuchet MS","Segoe UI",Verdana,sans-serif;fill:#f3eefb;stroke:var(--purple);stroke-width:3;stroke-dasharray:7 6;stroke-linejoin:round}
.ws .tracesvg .tbase{stroke:#cfc4dd;stroke-width:3;stroke-dasharray:10 8}
.ws .tracewrap{display:flex;align-items:center;gap:10px;flex:1 1 320px;min-width:0}
.ws .tracepad{position:relative;border:3px solid #e2d8f0;border-radius:12px;background:#fff;flex:0 1 auto}
.ws .tracecv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.ws .hearbtn{font-size:40px;line-height:1;width:74px;height:74px;border-radius:50%;border:3px solid var(--purple);background:#fff;cursor:pointer;box-shadow:0 3px 0 #4d2c75}
.ws .hearbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #4d2c75}
.ws .earprint{display:inline-flex;align-items:center;gap:4px}
.ws .earprint .emo{font-size:40px}
.ws .earnum{font-size:22px;font-weight:800;color:var(--purple)}
.ws .nosound{font-size:14px;color:#6d5f82;max-width:90px}
.ws .bank{border:3px solid var(--orange);background:var(--soft);border-radius:14px;padding:8px 12px;margin:4px 0 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ws .banklbl{font-weight:800;font-size:18px}
.ws .bankwords{display:flex;gap:10px;flex-wrap:wrap}
.ws .bankword{font-size:24px;font-weight:800;letter-spacing:2px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:4px 12px}
.ws .bank.hiddenbank{background:#fff;border-style:dashed;margin-top:12px}
.ws .bankfold{margin-top:16px}
.ws .foldline{border-top:3px dashed var(--ink);font-size:13px;padding-top:4px;color:#5b4d70;text-align:center}
.ws .bank.flipped{transform:rotate(180deg);margin-top:8px}
.ws .buildrow{display:flex;align-items:center;gap:20px;padding:10px 0;border-bottom:2px dotted #cfc4dd;flex-wrap:wrap}
.ws .buildright{display:flex;flex-direction:column;gap:10px;flex:1 1 240px}
.ws .tiles,.ws .slots{display:flex;gap:8px;flex-wrap:wrap}
.ws .tile{font:inherit;font-size:28px;font-weight:800;width:54px;height:54px;border-radius:12px;border:3px solid var(--purple);background:#f3eefb;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #b8a2d6}
.ws .tile:disabled{cursor:default}
.ws-print .tile{box-shadow:none;opacity:1}
.ws .tile.used{opacity:.25;box-shadow:none}
.ws .slot{width:54px;height:58px;border:3px solid var(--ink);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;background:#fff}
.ws-digital .slot{cursor:pointer}
.ws .slot.full{background:#ffe9d1;border-color:var(--orange)}
.ws .bankbtn{align-self:flex-start}
.ws .answer .writein,.ws .answer .writeline{flex:0 0 auto}

.ws .keypage{margin-top:24px;padding:16px 20px;border:3px solid var(--purple);border-radius:14px;background:#fbfaf7}
.ws .keypage h1{margin:0 0 6px;font-size:26px;color:var(--purple)}
.ws .keypage h2{margin:16px 0 4px;font-size:19px}
.ws .keypage li{font-size:15px;line-height:1.5;margin:3px 0}
.ws-print .act,.ws-print .keypage{break-inside:avoid;page-break-inside:avoid}
.ws-print .keypage{break-before:page;page-break-before:always}

@media (max-width:640px){
  .ws .top{flex-direction:column;align-items:stretch}
  .ws .name{max-width:none;flex:0 0 44px}
  .ws .top h1{font-size:26px}
  .ws .emo{font-size:42px}
  .ws .match{padding:0 6px}
  .ws .num{width:52px;height:52px;font-size:32px}
  .ws .nums{gap:12px}
  .ws .nums.spread{padding:0 10px}
  .ws .sq{width:22vw;height:22vw;font-size:26px}
  .ws .options{gap:10px}
  .ws .swatches .swatch{width:52px;height:52px}
  .ws .word{font-size:24px}
  .ws .step .emo{font-size:40px}
  .ws .numbox{width:40px;height:40px;font-size:20px}
  .ws .tile,.ws .slot{width:44px;height:46px;font-size:22px}
  .ws .hearbtn{width:60px;height:60px;font-size:32px}
}

    if (mode === 'show') return h('div', {class:'bank'}, h('span', {class:'banklbl'}, '📦 Word bank'), list);
    if (mode !== 'hidden') return null;
    if (ctx.mode !== 'digital') return h('div', {class:'bankfold'}, h('div', {class:'foldline'}, '✂️ Staff: fold this strip under. Unfold it if the student needs help.'), h('div', {class:'bank flipped'}, h('span', {class:'banklbl'}, '📦 Word bank'), list));
    list.hidden = true;
    const btn = h('button', {type:'button', class:'tbtn bankbtn', onclick:() => { list.hidden = !list.hidden; btn.textContent = list.hidden ? '👀 Need help? Show the word bank' : '🙈 Hide the word bank'; if (!list.hidden) onOpen(); }}, '👀 Need help? Show the word bank');
    return h('div', {class:'bank hiddenbank'}, btn, list);
  }
  const clean = v => String(v || '').toUpperCase().replace(/[^A-Z'-]/g, '');

  /* ---------- 10. write / type the word ---------- */
  const WRITE_INSTR = {
    word:      ['Trace the word, then write it on the line.', 'Trace the word with your finger. Then type it.'],
    pic:       ['Look at the picture. Write the word.', 'Look at the picture. Type the word.'],
    sound:     ['Listen to the word. Write it.', 'Tap the speaker to hear the word. Type it.'],
    'pic+sound':['Look and listen. Write the word.', 'Look at the picture. Tap the speaker. Type the word.']
  };
  T.write = {
    label:'Write / type the word', hint:'✍️',
    instr:(s, mode) => (WRITE_INSTR[s.prompt] || WRITE_INSTR.word)[mode === 'digital' ? 1 : 0],
    key:s => { const r = wordRows(s), p = s.prompt || 'word'; return (hasSound(p) ? 'Read these aloud in order: ' : '') + r.map((x, i) => (hasSound(p) ? (i + 1) + '. ' : '') + (x.e && hasPic(p) ? x.e + ' ' : '') + x.w).join(',  ') + (s.bank === 'hidden' ? '  (word bank is folded under at the bottom)' : ''); },
    build(s, ctx){
      const rows = wordRows(s), prompt = s.prompt || 'word', help = s.help || 'none';
      const box = h('div'); const items = []; let bankUsed = false;
      if (s.bank === 'show') box.appendChild(wordBank(rows.map(r => r.w), 'show', ctx));
      rows.forEach((r, i) => {
        const row = h('div', {class:'writerow' + (prompt === 'word' ? ' traceRow' : '')});
        let tp = null;
        if (prompt === 'word') {
          if (ctx.mode === 'digital') { tp = tracePad(r.w); row.appendChild(tp.el); }
          else row.appendChild(traceSvg(r.w).svg);
        } else row.appendChild(promptEl(r, prompt, ctx, i + 1));
        const ans = h('div', {class:'answer'});
        const hl = helpEl(r.w, help); if (hl) ans.appendChild(hl);
        if (ctx.mode === 'digital') {
          const inp = h('input', {type:'text', class:'writein', autocomplete:'off', autocorrect:'off', spellcheck:'false', autocapitalize:'characters', 'aria-label':'Type word ' + (i + 1)});
          ans.appendChild(inp); items.push({w:r.w, inp, tp});
        } else ans.appendChild(h('span', {class:'writeline'}));
        row.appendChild(ans);
        box.appendChild(row);
      });
      if (s.bank === 'hidden') box.appendChild(wordBank(rows.map(r => r.w), 'hidden', ctx, () => { bankUsed = true; }));
      if (ctx.mode !== 'digital') return {el:box};
      return {el:box, check:() => {
        const traced = items.filter(x => x.tp && x.tp.traced()).length;
        const notes = [];
        if (prompt === 'word') notes.push('traced ' + traced + ' of ' + items.length);
        if (s.bank === 'hidden') notes.push(bankUsed ? 'opened the word bank' : 'did not need the word bank');
        const wrong = items.filter(x => clean(x.inp.value) !== x.w).map(x => x.w + '→' + (clean(x.inp.value) || '(blank)'));
        if (wrong.length) notes.push('typed ' + wrong.join(', '));
        return {got: items.filter(x => clean(x.inp.value) === x.w).length, total: items.length, note: notes.join('; ')};
      }};
    }
  };

  /* ---------- 11. listen and circle ---------- */
  T.listen = {
    label:'Listen and circle', hint:'👂',
    instr:(s, mode) => mode === 'digital' ? 'Tap the speaker. Tap the word you hear.' : 'Listen to the word. Circle it.',
    key:s => 'Read these aloud in order: ' + s.rows.map((r, i) => (i + 1) + '. ' + r.w).join(',  '),
    build(s, ctx){
      const box = h('div'); const groups = [];
      s.rows.slice(0, 5).forEach((r, i) => {
        const all = [r.w].concat(r.d.slice(0, 3)); const n = all.length, pos = (i * 2 + 1) % n;
        const opts = all.slice(1); opts.splice(pos, 0, r.w);
        const els = opts.map(w => h('span', {class:'word'}, w));
        box.appendChild(h('div', {class:'wordrow'}, h('div', {class:'prompt'}, soundBtn(r.w, ctx, i + 1)), h('div', {class:'words'}, els)));
        groups.push({correct:pos, sel: ctx.mode === 'digital' ? selectable(els) : null});
      });
      return {el:box, check: ctx.mode === 'digital' ? () => ({got: groups.filter(g => g.sel[0] === g.correct).length, total: groups.length}) : null};
    }
  };

  /* ---------- 12. spell it with letter tiles ---------- */
  function scramble(w, row){
    const a = w.split(''); if (a.length < 2) return a;
    let out = a.map((ch, i) => ({ch, k:(i * 7 + 3) % (a.length + 2)})).sort((x, y) => x.k - y.k).map(x => x.ch);
    for (let r = (row || 0) % a.length; r > 0; r--) out.push(out.shift());
    for (let tries = 0; out.join('') === w && tries < a.length; tries++) out.push(out.shift());
    return out.join('') === w ? a.reverse() : out;
  }
  T.build = {
    label:'Spell it (letter tiles)', hint:'🔤',
    instr:(s, mode) => mode === 'digital'
      ? (hasSound(s.prompt || 'pic') && !hasPic(s.prompt || 'pic') ? 'Tap the speaker. Tap the letters in order.' : 'Look at the picture. Tap the letters in order to spell it.')
      : 'Use the letters to spell the word. Write one letter in each box.',
    key:s => wordRows(s).map(r => (r.e ? r.e + ' ' : '') + r.w).join(',  '),
    build(s, ctx){
      const rows = wordRows(s).slice(0, 5), prompt = s.prompt || 'pic';
      const box = h('div'); const items = [];
      rows.forEach((r, i) => {
        const letters = scramble(r.w, i);
        const tiles = letters.map(ch => h('button', {type:'button', class:'tile', disabled: ctx.mode === 'digital' ? null : true}, ch));
        const slots = r.w.split('').map(() => h('span', {class:'slot'}));
        const filled = r.w.split('').map(() => null);
        box.appendChild(h('div', {class:'buildrow'}, promptEl(r, prompt, ctx, i + 1), h('div', {class:'buildright'}, h('div', {class:'tiles'}, tiles), h('div', {class:'slots'}, slots))));
        if (ctx.mode === 'digital') {
          tiles.forEach((t, ti) => t.addEventListener('click', () => {
            const k = filled.indexOf(null); if (k < 0) return;
            filled[k] = ti; slots[k].textContent = letters[ti]; slots[k].classList.add('full'); t.disabled = true; t.classList.add('used');
          }));
          slots.forEach((sl, k) => { sl.tabIndex = 0; sl.setAttribute('role', 'button'); sl.setAttribute('aria-label', 'Letter box ' + (k + 1) + ', tap to take the letter back');
            const back = () => { const ti = filled[k]; if (ti == null) return; filled[k] = null; sl.textContent = ''; sl.classList.remove('full'); tiles[ti].disabled = false; tiles[ti].classList.remove('used'); };
            sl.addEventListener('click', back); sl.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); back(); } }); });
          items.push({w:r.w, get:() => filled.map(ti => ti == null ? '' : letters[ti]).join('')});
        }
      });
      if (ctx.mode !== 'digital') return {el:box};
      return {el:box, check:() => ({got: items.filter(x => x.get() === x.w).length, total: items.length})};
    }
  };

  function shell(i, s, body, ctx, cfg){
    const def = T[s.type];
    const text = (s.title && s.title.trim()) || def.instr(s, ctx.mode);
    const h2 = h('h2', null, h('span', {class:'badge'}, String(i + 1)), h('span', {class:'ttl'}, text), h('span', {class:'icon-hint'}, def.hint));
    if (ctx.mode === 'digital' && cfg.readAloud && window.speechSynthesis) h2.appendChild(h('button', {type:'button', class:'say', title:'Read aloud', 'aria-label':'Read aloud', onclick:() => speak(text)}, '🔊'));
    return h('section', {class:'act'}, h2, body);
  }
  function buildKey(cfg){
    const ul = h('ul');
    cfg.sections.forEach((s, i) => { const d = T[s.type]; if (d) ul.appendChild(h('li', null, h('b', null, (i + 1) + '. ' + d.label + ': '), d.key(s))); });
    return h('section', {class:'keypage'},
      h('h1', null, 'Staff page: do not hand out'),
      h('h2', null, 'Answer key'), ul,
      h('h2', null, 'Ways to adapt'),
      h('ul', null,
        h('li', null, 'Do it as a group with the page on a big screen. Let students come up to circle or draw.'),
        h('li', null, 'Say each direction out loud and point to the example. A peer helper works well.'),
        h('li', null, 'Use thick markers or dot markers for students with fine-motor challenges.'),
        h('li', null, 'Skip sections as needed. The reading sections (word match, listen, spell it, write / type) are optional.'),
        h('li', null, 'For 🔊 sections on paper, read each word aloud in the order shown in the answer key.')));
  }
  function dl(name, blob){
    const a = h('a', {href:URL.createObjectURL(blob), download:name}); document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }

  function mount(root, cfg, mode){
    root.textContent = '';
    root.classList.remove('ws-print', 'ws-digital'); root.classList.add('ws', 'ws-' + mode);
    const ctx = {mode}; const parts = [];
    const nameEl = mode === 'digital' ? h('input', {type:'text', placeholder:'Name', 'aria-label':'Name', autocomplete:'off'}) : null;
    let lastTypedName = '';
    if (nameEl) nameEl.addEventListener('input', () => { lastTypedName = nameEl.value.trim(); });
    root.appendChild(h('div', {class:'top'}, h('h1', null, cfg.emoji ? h('span', {class:'he'}, cfg.emoji) : null, cfg.title || 'Worksheet'), h('div', {class:'name'}, nameEl)));
    cfg.sections.forEach((s, i) => {
      if (!T[s.type]) return;
      const b = T[s.type].build(s, ctx);
      parts.push({s, b});
      root.appendChild(shell(i, s, b.el, ctx, cfg));
    });
    if (mode === 'print') { if (cfg.staffKey) root.appendChild(buildKey(cfg)); return; }

    const done = h('button', {type:'button', class:'bigbtn'}, "🎉 I'm done!");
    const out = h('div', {class:'resultwrap'});
    root.appendChild(h('div', {class:'donebar'}, done)); root.appendChild(out);

    done.addEventListener('click', () => {
      let got = 0, total = 0; const details = [];
      parts.forEach((p, i) => { if (!p.b.check) return; const r = p.b.check(); got += r.got; total += r.total; details.push({n:i + 1, label:T[p.s.type].label, got:r.got, total:r.total, note:r.note || ''}); });
      const drawPart = parts.filter(p => p.b.canvas)[0];
      const drew = !!(drawPart && drawPart.b.hasDrawing());
      const pct = total ? got / total : 1;
      const stars = pct >= 0.9 ? '⭐⭐⭐' : pct >= 0.6 ? '⭐⭐' : '⭐';
      try { nameEl.blur(); } catch(e) {}
      const liveVal = (nameEl.value || '').trim();
      const name = liveVal || lastTypedName;
      const text = () => {
        const L = [(cfg.title || 'Worksheet') + ' - results', 'Student: ' + (name || '(no name entered)'), 'Date: ' + new Date().toLocaleString(), 'Score: ' + got + ' of ' + total, ''];
        details.forEach(d => L.push(d.n + '. ' + d.label + ': ' + d.got + ' of ' + d.total + (d.note ? '  (' + d.note + ')' : '')));
        if (drawPart) L.push('', 'Drawing: ' + (drew ? 'made (saved as a picture by the student)' : 'not started'));
        return L.join('\n');
      };
      out.textContent = '';
      const chips = h('div', {class:'breakdown'}, details.map(d => h('span', {class:'chip ' + (d.got === d.total ? 'ok' : 'try')}, (d.got === d.total ? '✅ ' : '🔁 ') + d.n)));
      const em = h('input', {type:'email', class:'emailin', placeholder:'name@example.com', value:cfg.email || '', 'aria-label':'Email address for results'});
      const btns = h('div', {class:'rbtns'},
        h('button', {type:'button', class:'bigbtn', onclick:() => {
          const q = 'to=' + encodeURIComponent(em.value.trim()) + '&su=' + encodeURIComponent((cfg.subject || 'Worksheet results') + (name ? ' - ' + name : '')) + '&body=' + encodeURIComponent(text());
          const w = window.open('https://mail.google.com/mail/?view=cm&fs=1&' + q, '_blank');
          if (!w) window.location.href = 'https://mail.google.com/mail/?view=cm&fs=1&' + q;
        }}, '📧 Open in Gmail'),
        h('button', {type:'button', class:'tbtn big', onclick:() => {
          const a = h('a', {href:'mailto:' + em.value.trim() + '?subject=' + encodeURIComponent((cfg.subject || 'Worksheet results') + (name ? ' - ' + name : '')) + '&body=' + encodeURIComponent(text())});
          document.body.appendChild(a); a.click(); a.remove();
        }}, '✉️ Email app'),
        h('button', {type:'button', class:'tbtn big', onclick:function(){
          const btn = this, t = text();
          const ok = () => { btn.textContent = '✅ Copied'; setTimeout(() => { btn.textContent = '📋 Copy results'; }, 2000); };
          const fallback = () => { const ta = h('textarea', {style:'position:fixed;left:-999px'}); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch(e) {} ta.remove(); };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, fallback); else fallback();
        }}, '📋 Copy results'),
        h('button', {type:'button', class:'tbtn big', onclick:() => dl('results' + (name ? '-' + name.replace(/[^\w-]+/g, '_') : '') + '.txt', new Blob([text()], {type:'text/plain'}))}, '💾 Save results file'),
        drawPart && drew ? h('button', {type:'button', class:'tbtn big', onclick:() => drawPart.b.canvas.toBlob(b => dl('my-design' + (name ? '-' + name.replace(/[^\w-]+/g, '_') : '') + '.png', b))}, '🖼️ Save my drawing') : null,
        h('button', {type:'button', class:'tbtn big', onclick:() => { mount(root, cfg, mode); window.scrollTo(0, 0); }}, '🔄 Start over'));
      out.appendChild(h('div', {class:'result'},
        h('div', {class:'stars'}, stars),
        h('h2', null, cfg.showScore ? 'You got ' + got + ' of ' + total + '!' : 'Great work!'),
        cfg.showScore ? chips : null,
        h('div', {class:'emailrow'}, h('label', null, '📧 Send to: '), em),
        btns,
        h('p', {class:'note'}, 'Open in Gmail needs internet and a Gmail sign-in. No internet? Use Copy results or Save results file. Attach the saved drawing if you want to send it too.')));
      out.scrollIntoView({behavior:'smooth', block:'start'});
    });
  }

  window.WS = {mount:mount, h:h, glyphs:glyphs, PALETTE:PALETTE, NAMES:NAMES, TYPES:T, VOCAB:VOCAB};
})();
WS.mount(document.getElementById("root"),CONFIG,"digital");
</script></body></html>
